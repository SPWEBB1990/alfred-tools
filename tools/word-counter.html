<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word & Character Counter — Free Online Tool</title>
    <meta name="description" content="Count words, characters, sentences, and paragraphs instantly. Reading time estimate and keyword density analysis. Free, fast, no data sent to any server.">
    <meta name="keywords" content="word counter, character counter, word count online, reading time calculator, keyword density">
    <meta property="og:title" content="Word & Character Counter — Free Online Tool">
    <meta property="og:description" content="Count words, characters, sentences, and paragraphs instantly.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Word & Character Counter",
        "description": "Count words, characters, sentences, and paragraphs instantly.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117; --surface: #1a1d27; --surface2: #242734;
            --border: #2e3244; --text: #e1e4ed; --text-muted: #8b8fa7;
            --accent: #6c7bf7; --accent-hover: #8b97ff;
            --success: #4ade80; --radius: 10px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
        header { text-align: center; padding: 2rem 1rem 1rem; }
        header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); margin-top: 0.3rem; font-size: 0.95rem; }
        .back-link { display: inline-block; margin-bottom: 0.5rem; color: var(--accent); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: var(--accent-hover); }
        .container { max-width: 900px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }
        textarea { width: 100%; min-height: 220px; padding: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 0.95rem; resize: vertical; outline: none; transition: border-color 0.15s; line-height: 1.7; }
        textarea:focus { border-color: var(--accent); }
        textarea::placeholder { color: var(--text-muted); }
        .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.8rem; margin: 1.2rem 0; }
        .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
        .section-title { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; margin: 1.5rem 0 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .keyword-list { list-style: none; display: flex; flex-direction: column; gap: 0.3rem; }
        .keyword-item { display: flex; align-items: center; gap: 0.8rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem 1rem; font-size: 0.9rem; }
        .keyword-word { font-weight: 600; min-width: 120px; }
        .keyword-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
        .keyword-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
        .keyword-count { color: var(--text-muted); font-size: 0.8rem; min-width: 60px; text-align: right; }
        .empty-msg { color: var(--text-muted); font-size: 0.9rem; font-style: italic; }
        .btn { padding: 0.5rem 1.2rem; border: none; border-radius: var(--radius); font-size: 0.85rem; font-weight: 600; cursor: pointer; background: var(--surface2); color: var(--text); border: 1px solid var(--border); transition: all 0.15s; }
        .btn:hover { border-color: var(--accent); }
        @media (max-width: 640px) { .container { padding: 1rem; } .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
<header>
    <a href="../" class="back-link">← Alfred's Digital Workshop</a>
    <h1>Word & Character <span>Counter</span></h1>
    <p>Paste or type text for live stats, reading time, and keyword density</p>
</header>
<div class="container">
    <textarea id="input" placeholder="Start typing or paste your text here…" oninput="analyze()"></textarea>
    <div style="margin-top:0.5rem;">
        <button class="btn" onclick="document.getElementById('input').value='';analyze();">Clear</button>
    </div>

    <div class="stats">
        <div class="stat"><div class="stat-value" id="words">0</div><div class="stat-label">Words</div></div>
        <div class="stat"><div class="stat-value" id="chars">0</div><div class="stat-label">Characters</div></div>
        <div class="stat"><div class="stat-value" id="charsNoSpace">0</div><div class="stat-label">Chars (no spaces)</div></div>
        <div class="stat"><div class="stat-value" id="sentences">0</div><div class="stat-label">Sentences</div></div>
        <div class="stat"><div class="stat-value" id="paragraphs">0</div><div class="stat-label">Paragraphs</div></div>
        <div class="stat"><div class="stat-value" id="readTime">0s</div><div class="stat-label">Reading Time</div></div>
    </div>

    <div class="section-title">Top Keywords</div>
    <div id="keywords"><p class="empty-msg">Type something to see keyword density…</p></div>
</div>

<script>
const stopWords = new Set(['the','be','to','of','and','a','in','that','have','i','it','for','not','on','with','he','as','you','do','at','this','but','his','by','from','they','we','her','she','or','an','will','my','one','all','would','there','their','what','so','up','out','if','about','who','get','which','go','me','when','make','can','like','time','no','just','him','know','take','people','into','year','your','good','some','could','them','see','other','than','then','now','look','only','come','its','over','think','also','back','after','use','two','how','our','work','first','well','way','even','new','want','because','any','these','give','day','most','us','is','are','was','were','been','being','has','had','did','does','am','may','might','shall','should','must','need','dare','ought','used','going']);

function analyze() {
    const text = document.getElementById('input').value;
    const trimmed = text.trim();

    // Words
    const words = trimmed ? trimmed.split(/\s+/).filter(w => w.length > 0) : [];
    document.getElementById('words').textContent = words.length;

    // Characters
    document.getElementById('chars').textContent = text.length;
    document.getElementById('charsNoSpace').textContent = text.replace(/\s/g, '').length;

    // Sentences
    const sentences = trimmed ? trimmed.split(/[.!?]+/).filter(s => s.trim().length > 0).length : 0;
    document.getElementById('sentences').textContent = sentences;

    // Paragraphs
    const paragraphs = trimmed ? trimmed.split(/\n\s*\n/).filter(p => p.trim().length > 0).length : 0;
    document.getElementById('paragraphs').textContent = paragraphs || (trimmed ? 1 : 0);

    // Reading time (avg 238 wpm)
    const mins = words.length / 238;
    document.getElementById('readTime').textContent = mins < 1 ? Math.round(mins * 60) + 's' : Math.ceil(mins) + 'min';

    // Keyword density
    const freq = {};
    words.forEach(w => {
        const clean = w.toLowerCase().replace(/[^a-z0-9'-]/g, '');
        if (clean.length > 2 && !stopWords.has(clean)) freq[clean] = (freq[clean] || 0) + 1;
    });
    const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const kw = document.getElementById('keywords');

    if (!sorted.length) { kw.innerHTML = '<p class="empty-msg">Type something to see keyword density…</p>'; return; }

    const max = sorted[0][1];
    kw.innerHTML = '<ul class="keyword-list">' + sorted.map(([word, count]) =>
        `<li class="keyword-item"><span class="keyword-word">${word}</span><div class="keyword-bar-bg"><div class="keyword-bar" style="width:${(count/max*100).toFixed(0)}%"></div></div><span class="keyword-count">${count} (${(count/words.length*100).toFixed(1)}%)</span></li>`
    ).join('') + '</ul>';
}
</script>
</body>
</html>
