<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Preview — Free Online Tool</title>
    <meta name="description" content="Type or paste markdown and see rendered HTML in real-time. Supports headers, bold, italic, lists, code blocks, links, and images. Free, no tracking.">
    <meta name="keywords" content="markdown preview, markdown editor, markdown to html, live markdown, markdown renderer">
    <meta property="og:title" content="Markdown Preview — Free Online Tool">
    <meta property="og:description" content="Type or paste markdown and see rendered HTML in real-time.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Markdown Preview",
        "description": "Type or paste markdown and see rendered HTML in real-time.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117; --surface: #1a1d27; --surface2: #242734;
            --border: #2e3244; --text: #e1e4ed; --text-muted: #8b8fa7;
            --accent: #6c7bf7; --accent-hover: #8b97ff;
            --success: #4ade80; --error: #f7596c; --radius: 10px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }
        .back { display: inline-block; padding: 1rem 1rem 0; font-size: 0.9rem; }
        header { text-align: center; padding: 1.5rem 1rem 1rem; }
        header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); margin-top: 0.3rem; font-size: 0.95rem; }
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            justify-content: center; padding: 0.75rem 1rem;
        }
        .btn {
            padding: 0.5rem 1rem; border: 1px solid var(--border);
            border-radius: var(--radius); background: var(--surface);
            color: var(--text); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
            display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .btn:hover { background: var(--surface2); border-color: var(--accent); }
        .editor-wrap {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
            background: var(--border); margin: 0 1rem 1rem;
            border-radius: var(--radius); overflow: hidden; min-height: 70vh;
        }
        .pane { display: flex; flex-direction: column; background: var(--surface); }
        .pane-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.6rem 1rem; background: var(--surface2);
            font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--text-muted);
        }
        #input {
            flex: 1; width: 100%; border: none; background: transparent;
            color: var(--text); font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 0.85rem; line-height: 1.7; padding: 1rem;
            resize: none; outline: none; tab-size: 2;
        }
        #input::placeholder { color: var(--text-muted); }
        #preview {
            flex: 1; overflow: auto; padding: 1rem; font-size: 0.9rem; line-height: 1.7;
        }
        /* Markdown rendered styles */
        #preview h1 { font-size: 1.6rem; font-weight: 700; margin: 1rem 0 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
        #preview h2 { font-size: 1.3rem; font-weight: 700; margin: 0.8rem 0 0.4rem; }
        #preview h3 { font-size: 1.1rem; font-weight: 600; margin: 0.6rem 0 0.3rem; }
        #preview h4, #preview h5, #preview h6 { font-size: 1rem; font-weight: 600; margin: 0.5rem 0 0.2rem; }
        #preview p { margin: 0.5rem 0; }
        #preview strong { font-weight: 700; }
        #preview em { font-style: italic; }
        #preview code {
            background: var(--surface2); padding: 0.15rem 0.4rem; border-radius: 4px;
            font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.85em;
        }
        #preview pre {
            background: var(--surface2); padding: 1rem; border-radius: var(--radius);
            overflow-x: auto; margin: 0.5rem 0;
        }
        #preview pre code { background: none; padding: 0; }
        #preview blockquote {
            border-left: 3px solid var(--accent); padding: 0.3rem 0 0.3rem 1rem;
            color: var(--text-muted); margin: 0.5rem 0;
        }
        #preview ul, #preview ol { padding-left: 1.5rem; margin: 0.5rem 0; }
        #preview li { margin: 0.2rem 0; }
        #preview a { color: var(--accent); }
        #preview img { max-width: 100%; border-radius: var(--radius); margin: 0.5rem 0; }
        #preview hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
        #preview table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
        #preview th, #preview td { border: 1px solid var(--border); padding: 0.4rem 0.8rem; text-align: left; }
        #preview th { background: var(--surface2); font-weight: 600; }
        .toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface2); border: 1px solid var(--border);
            padding: 0.6rem 1.2rem; border-radius: var(--radius);
            font-size: 0.85rem; opacity: 0; transition: all 0.3s; z-index: 100;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        footer { text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 0.8rem; }
        footer a { color: var(--accent); }
        @media (max-width: 768px) {
            .editor-wrap { grid-template-columns: 1fr; min-height: auto; }
            .pane { min-height: 35vh; }
            header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back">← Alfred's Digital Workshop</a>
    <header>
        <h1><span>📝</span> Markdown Preview</h1>
        <p>Type markdown on the left, see rendered HTML on the right</p>
    </header>
    <div class="toolbar">
        <button class="btn" onclick="copyHTML()">📋 Copy HTML</button>
        <button class="btn" onclick="copyMd()">📋 Copy Markdown</button>
        <button class="btn" onclick="clearAll()">Clear</button>
        <button class="btn" onclick="loadSample()">Sample</button>
    </div>
    <div class="editor-wrap">
        <div class="pane">
            <div class="pane-header"><span>Markdown</span></div>
            <textarea id="input" placeholder="Type your markdown here..."></textarea>
        </div>
        <div class="pane">
            <div class="pane-header"><span>Preview</span></div>
            <div id="preview"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <footer>
        100% in-browser rendering &nbsp;|&nbsp;
        <a href="../index.html">More Tools →</a>
    </footer>
    <script>
        const input = document.getElementById('input');
        const preview = document.getElementById('preview');

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function parseMd(md) {
            let html = md;
            // Code blocks
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
                `<pre><code>${escHtml(code.trimEnd())}</code></pre>`);
            // Blockquotes
            html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
            // Merge consecutive blockquotes
            html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');
            // Headings
            html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
            html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
            html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
            // Horizontal rules
            html = html.replace(/^---+$/gm, '<hr>');
            // Images
            html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            // Bold + italic
            html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');
            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Unordered lists
            html = html.replace(/^(\s*)[*-]\s+(.+)$/gm, '<li>$2</li>');
            html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
            // Ordered lists
            html = html.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
            // Wrap remaining orphan li in ol (crude but works for simple cases)
            html = html.replace(/(<li>(?:(?!<\/?[uo]l>).)*<\/li>\n?)+/g, m => {
                if (!m.includes('<ul>') && !m.includes('</ul>')) return '<ol>' + m + '</ol>';
                return m;
            });
            // Paragraphs: wrap lines not already in block elements
            html = html.split('\n\n').map(block => {
                block = block.trim();
                if (!block) return '';
                if (/^<(h[1-6]|ul|ol|li|pre|blockquote|hr|table|div|p)/.test(block)) return block;
                return `<p>${block.replace(/\n/g, '<br>')}</p>`;
            }).join('\n');
            return html;
        }

        function render() {
            preview.innerHTML = parseMd(input.value);
        }

        let debounce;
        input.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(render, 100); });

        // Tab key support
        input.addEventListener('keydown', e => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const s = input.selectionStart, end = input.selectionEnd;
                input.value = input.value.substring(0, s) + '  ' + input.value.substring(end);
                input.selectionStart = input.selectionEnd = s + 2;
                render();
            }
        });

        function copyHTML() {
            navigator.clipboard.writeText(preview.innerHTML).then(() => toast('HTML copied!'));
        }
        function copyMd() {
            navigator.clipboard.writeText(input.value).then(() => toast('Markdown copied!'));
        }
        function clearAll() { input.value = ''; preview.innerHTML = ''; }
        function loadSample() {
            input.value = `# Hello World

This is a **markdown** preview tool with *real-time* rendering.

## Features

- **Bold** and *italic* text
- ~~Strikethrough~~ support
- [Links](https://example.com) and images
- Code blocks with syntax display

### Code Example

\`\`\`javascript
function greet(name) {
    return \`Hello, \${name}!\`;
}
\`\`\`

> Blockquotes look great too!

Inline \`code\` works as well.

---

1. Ordered lists
2. Work perfectly
3. As expected

![Placeholder](https://via.placeholder.com/300x100/242734/6c7bf7?text=Markdown+Preview)
`;
            render();
            toast('Sample loaded');
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }

        loadSample();
    </script>
</body>
</html>
