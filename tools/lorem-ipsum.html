<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum Generator — Free Placeholder Text Tool</title>
    <meta name="description" content="Generate placeholder text in classic Latin, hipster, or tech-themed styles. Choose paragraphs, sentences, or words. Free, no tracking.">
    <meta name="keywords" content="lorem ipsum generator, placeholder text, dummy text, filler text, lipsum generator">
    <meta property="og:title" content="Lorem Ipsum Generator — Free Placeholder Text Tool">
    <meta property="og:description" content="Generate placeholder text in multiple styles — classic, hipster, or tech-themed.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Lorem Ipsum Generator",
        "description": "Generate placeholder text in multiple styles.",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117; --surface: #1a1d27; --surface2: #242734;
            --border: #2e3244; --text: #e1e4ed; --text-muted: #8b8fa7;
            --accent: #6c7bf7; --accent-hover: #8b97ff;
            --success: #4ade80; --radius: 10px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }
        .back { display: inline-block; padding: 1rem 1rem 0; font-size: 0.9rem; }
        header { text-align: center; padding: 1.5rem 1rem 1rem; }
        header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); margin-top: 0.3rem; font-size: 0.95rem; }
        .container { max-width: 700px; margin: 1.5rem auto; padding: 0 1rem; }
        .controls {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1rem;
            display: flex; flex-wrap: wrap; gap: 1rem; align-items: end;
        }
        .control-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .control-group label {
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--text-muted);
        }
        select, input[type="number"] {
            padding: 0.5rem 0.7rem; border: 1px solid var(--border);
            border-radius: var(--radius); background: var(--surface2);
            color: var(--text); font-size: 0.9rem; outline: none;
        }
        select:focus, input[type="number"]:focus { border-color: var(--accent); }
        input[type="number"] { width: 80px; }
        .btn {
            padding: 0.5rem 1rem; border: 1px solid var(--border);
            border-radius: var(--radius); background: var(--surface);
            color: var(--text); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
            display: inline-flex; align-items: center; gap: 0.4rem;
        }
        .btn:hover { background: var(--surface2); border-color: var(--accent); }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn.primary:hover { background: var(--accent-hover); }
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .output {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.2rem;
            min-height: 200px; line-height: 1.8; font-size: 0.95rem;
            white-space: pre-wrap; user-select: all;
        }
        .output p { margin-bottom: 1rem; }
        .output p:last-child { margin-bottom: 0; }
        .stats { text-align: center; padding: 0.5rem; font-size: 0.75rem; color: var(--text-muted); }
        .toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface2); border: 1px solid var(--border);
            padding: 0.6rem 1.2rem; border-radius: var(--radius);
            font-size: 0.85rem; opacity: 0; transition: all 0.3s; z-index: 100;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        footer { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.8rem; }
        footer a { color: var(--accent); }
        @media (max-width: 640px) {
            header h1 { font-size: 1.3rem; }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back">← Alfred's Digital Workshop</a>
    <header>
        <h1><span>📄</span> Lorem Ipsum Generator</h1>
        <p>Generate placeholder text in multiple styles</p>
    </header>
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label>Style</label>
                <select id="style">
                    <option value="classic">Classic Latin</option>
                    <option value="hipster">Hipster</option>
                    <option value="tech">Tech-Themed</option>
                </select>
            </div>
            <div class="control-group">
                <label>Unit</label>
                <select id="unit">
                    <option value="paragraphs">Paragraphs</option>
                    <option value="sentences">Sentences</option>
                    <option value="words">Words</option>
                </select>
            </div>
            <div class="control-group">
                <label>Count</label>
                <input type="number" id="count" value="3" min="1" max="100">
            </div>
            <button class="btn primary" onclick="gen()">Generate</button>
        </div>
        <div class="actions">
            <button class="btn" onclick="copyText()">📋 Copy Text</button>
            <button class="btn" onclick="copyHtml()">📋 Copy as HTML</button>
        </div>
        <div class="output" id="output"></div>
        <div class="stats" id="stats"></div>
    </div>
    <div class="toast" id="toast"></div>
    <footer>
        <a href="../index.html">More Tools →</a>
    </footer>
    <script>
        const corpus = {
            classic: [
                "Lorem ipsum dolor sit amet, consectetur adipiscing elit.",
                "Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
                "Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.",
                "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore.",
                "Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia.",
                "Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.",
                "Neque porro quisquam est qui dolorem ipsum quia dolor sit amet.",
                "Ut enim ad minima veniam, quis nostrum exercitationem ullam corporis.",
                "Quis autem vel eum iure reprehenderit qui in ea voluptate velit esse.",
                "At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis.",
                "Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit.",
                "Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus.",
                "Itaque earum rerum hic tenetur a sapiente delectus ut aut reiciendis.",
                "Nulla facilisi morbi tempus iaculis urna id volutpat lacus laoreet.",
                "Viverra justo nec ultrices dui sapien eget mi proin sed libero.",
                "Pellentesque habitant morbi tristique senectus et netus et malesuada fames.",
                "Amet consectetur adipiscing elit pellentesque habitant morbi tristique senectus.",
                "Turpis egestas maecenas pharetra convallis posuere morbi leo urna molestie.",
                "Facilisis magna etiam tempor orci eu lobortis elementum nibh tellus.",
                "Cras tincidunt lobortis feugiat vivamus at augue eget arcu dictum varius."
            ],
            hipster: [
                "Artisan craft beer vinyl, normcore schlitz sustainable pork belly echo park.",
                "Helvetica tattooed vexillologist, raw denim thundercats kinfolk aesthetic.",
                "Bushwick irony keytar, cold-pressed heirloom poutine fixie freegan chambray.",
                "Shoreditch mixtape cronut, prism biodiesel gentrify aesthetic pour-over sriracha.",
                "Activated charcoal tumblr truffaut, glossier pinterest unicorn williamsburg.",
                "Banjo farm-to-table etsy, waistcoat chia edison bulb vaporware dreamcatcher.",
                "Adaptogen mlkshk beard, cornhole selfies tacos single-origin coffee marfa.",
                "Hella sustainable vaporware, pitchfork ennui synth cloud bread butcher.",
                "Taxidermy venmo portland, flexitarian iPhone slow-carb tumeric kombucha.",
                "Shabby chic kale chips next level, pok pok messenger bag typewriter brooklyn.",
                "Listicle wolf ethical, hashtag brunch street art gochujang lumbersexual.",
                "Bitters forage seitan, meggings taiyaki cliche lo-fi air plant stumptown.",
                "Retro meh copper mug, 8-bit plaid coloring book palo santo migas quinoa.",
                "Mumblecore photo booth disrupt, blog knausgaard post-ironic VHS fanny pack.",
                "Deep v viral neutra, try-hard raclette before they sold out health goth jianbing."
            ],
            tech: [
                "The microservice architecture leverages containerized deployments for horizontal scaling.",
                "Machine learning pipelines require robust feature engineering and model validation.",
                "Kubernetes orchestration enables seamless rolling updates across distributed clusters.",
                "GraphQL resolvers provide flexible data fetching compared to traditional REST endpoints.",
                "Event-driven architectures decouple services through asynchronous message queues.",
                "WebAssembly modules deliver near-native performance in browser-based applications.",
                "Zero-trust security models authenticate every request regardless of network location.",
                "Serverless functions automatically scale compute resources based on incoming traffic.",
                "Edge computing reduces latency by processing data closer to the end user.",
                "Blockchain consensus mechanisms ensure data integrity across decentralized networks.",
                "CI/CD pipelines automate testing, building, and deploying code to production environments.",
                "Infrastructure as code enables reproducible and version-controlled cloud provisioning.",
                "API gateway patterns consolidate authentication, rate limiting, and request routing.",
                "Observability stacks combine metrics, logs, and traces for comprehensive system monitoring.",
                "Progressive web apps bridge the gap between native and web experiences with offline support.",
                "Vector databases enable semantic search through high-dimensional embedding comparisons.",
                "Large language models transform natural language understanding across enterprise workflows.",
                "GitOps workflows use declarative configurations stored in version control as the source of truth.",
                "Service mesh implementations handle inter-service communication, retries, and circuit breaking.",
                "Real-time streaming platforms process millions of events per second with sub-millisecond latency."
            ]
        };

        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

        function getSentences(style, n) {
            const src = corpus[style];
            const result = [];
            for (let i = 0; i < n; i++) result.push(pick(src));
            return result;
        }

        function gen() {
            const style = document.getElementById('style').value;
            const unit = document.getElementById('unit').value;
            const count = Math.max(1, Math.min(100, +document.getElementById('count').value || 3));
            const out = document.getElementById('output');
            let text = '';

            if (unit === 'words') {
                const words = [];
                while (words.length < count) {
                    const s = pick(corpus[style]);
                    s.split(/\s+/).forEach(w => { if (words.length < count) words.push(w); });
                }
                // Capitalize first, ensure period at end
                words[0] = words[0].charAt(0).toUpperCase() + words[0].slice(1);
                let final = words.join(' ');
                if (!final.endsWith('.')) final = final.replace(/[,;]$/, '') + '.';
                text = final;
            } else if (unit === 'sentences') {
                text = getSentences(style, count).join(' ');
            } else {
                const paragraphs = [];
                for (let i = 0; i < count; i++) {
                    const sentCount = 4 + Math.floor(Math.random() * 4);
                    paragraphs.push(getSentences(style, sentCount).join(' '));
                }
                text = paragraphs.join('\n\n');
            }

            out.textContent = text;
            const wc = text.split(/\s+/).filter(Boolean).length;
            document.getElementById('stats').textContent = `${wc} words · ${text.length} characters`;
        }

        function copyText() {
            const text = document.getElementById('output').textContent;
            if (!text) return toast('Generate some text first');
            navigator.clipboard.writeText(text).then(() => toast('Copied!'));
        }
        function copyHtml() {
            const text = document.getElementById('output').textContent;
            if (!text) return toast('Generate some text first');
            const html = text.split('\n\n').map(p => `<p>${p}</p>`).join('\n');
            navigator.clipboard.writeText(html).then(() => toast('HTML copied!'));
        }
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }

        gen();
    </script>
</body>
</html>
