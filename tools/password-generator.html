<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator — Free Secure Password Tool</title>
    <meta name="description" content="Generate strong, secure passwords with customizable length, character types, and strength meter. Free, runs entirely in your browser.">
    <meta name="keywords" content="password generator, secure password, random password, strong password generator, password tool">
    <meta property="og:title" content="Password Generator — Free Secure Password Tool">
    <meta property="og:description" content="Generate strong, secure passwords instantly in your browser.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Password Generator",
        "description": "Generate strong, secure passwords with customizable options.",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117; --surface: #1a1d27; --surface2: #242734;
            --border: #2e3244; --text: #e1e4ed; --text-muted: #8b8fa7;
            --accent: #6c7bf7; --accent-hover: #8b97ff;
            --error: #f7596c; --success: #4ade80; --warning: #f7b955;
            --radius: 10px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }
        .back { display: inline-block; padding: 1rem 1rem 0; font-size: 0.9rem; }
        header { text-align: center; padding: 1.5rem 1rem 1rem; }
        header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-muted); margin-top: 0.3rem; font-size: 0.95rem; }
        .container { max-width: 560px; margin: 1.5rem auto; padding: 0 1rem; }
        .pw-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .pw-box .pw {
            flex: 1; font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 1.1rem; word-break: break-all; user-select: all;
        }
        .btn {
            padding: 0.5rem 0.8rem; border: 1px solid var(--border);
            border-radius: var(--radius); background: var(--surface);
            color: var(--text); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
            display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap;
        }
        .btn:hover { background: var(--surface2); border-color: var(--accent); }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn.primary:hover { background: var(--accent-hover); }
        .strength-bar {
            height: 6px; border-radius: 3px; background: var(--surface2);
            margin-bottom: 0.3rem; overflow: hidden;
        }
        .strength-fill { height: 100%; border-radius: 3px; transition: width 0.3s, background 0.3s; }
        .strength-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.2rem; }
        .option-group { margin-bottom: 1.2rem; }
        .option-group label {
            display: block; font-size: 0.8rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-muted); margin-bottom: 0.4rem;
        }
        .slider-row {
            display: flex; align-items: center; gap: 0.8rem;
        }
        .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
        .slider-row .val {
            min-width: 36px; text-align: center; font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 0.95rem; font-weight: 600;
        }
        .checks { display: flex; flex-wrap: wrap; gap: 0.6rem 1.2rem; }
        .checks label {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.9rem; cursor: pointer; text-transform: none;
            letter-spacing: normal; font-weight: 400; color: var(--text);
        }
        .checks input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
        .multi-list {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 0.8rem; max-height: 200px;
            overflow-y: auto; font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 0.85rem; line-height: 1.8;
        }
        .multi-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.2rem 0; border-bottom: 1px solid var(--border);
        }
        .multi-item:last-child { border-bottom: none; }
        .multi-item .copy-single { cursor: pointer; color: var(--text-muted); font-size: 0.8rem; }
        .multi-item .copy-single:hover { color: var(--accent); }
        .toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface2); border: 1px solid var(--border);
            padding: 0.6rem 1.2rem; border-radius: var(--radius);
            font-size: 0.85rem; opacity: 0; transition: all 0.3s; z-index: 100;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        footer { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.8rem; }
        footer a { color: var(--accent); }
        @media (max-width: 640px) {
            header h1 { font-size: 1.3rem; }
            .pw-box .pw { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back">← Alfred's Digital Workshop</a>
    <header>
        <h1><span>🔑</span> Password Generator</h1>
        <p>Generate strong, secure passwords — everything runs in your browser</p>
    </header>
    <div class="container">
        <div class="pw-box">
            <div class="pw" id="password"></div>
            <button class="btn" onclick="copyPw()">📋</button>
            <button class="btn" onclick="generate()">🔄</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel">—</div>

        <div class="option-group">
            <label>Length</label>
            <div class="slider-row">
                <input type="range" id="length" min="8" max="128" value="20">
                <span class="val" id="lenVal">20</span>
            </div>
        </div>

        <div class="option-group">
            <label>Characters</label>
            <div class="checks">
                <label><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label>
                <label><input type="checkbox" id="lower" checked> Lowercase (a-z)</label>
                <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
                <label><input type="checkbox" id="symbols" checked> Symbols (!@#$...)</label>
                <label><input type="checkbox" id="exclude"> Exclude ambiguous (0OoIl1)</label>
            </div>
        </div>

        <div class="actions">
            <button class="btn primary" onclick="generate()">🔑 Generate</button>
            <button class="btn" onclick="generateMulti()">Generate 5</button>
            <button class="btn" onclick="copyPw()">📋 Copy</button>
        </div>

        <div class="multi-list" id="multiList" style="display:none;"></div>
    </div>
    <div class="toast" id="toast"></div>
    <footer>
        Uses crypto.getRandomValues() for true randomness &nbsp;|&nbsp;
        <a href="../index.html">More Tools →</a>
    </footer>
    <script>
        const $ = id => document.getElementById(id);
        const lengthSlider = $('length');
        const lenVal = $('lenVal');

        lengthSlider.addEventListener('input', () => { lenVal.textContent = lengthSlider.value; generate(); });
        ['upper','lower','numbers','symbols','exclude'].forEach(id => {
            $(id).addEventListener('change', generate);
        });

        function getCharset() {
            const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lower = 'abcdefghijklmnopqrstuvwxyz';
            const nums = '0123456789';
            const syms = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            const ambiguous = '0OoIl1';
            let charset = '';
            if ($('upper').checked) charset += upper;
            if ($('lower').checked) charset += lower;
            if ($('numbers').checked) charset += nums;
            if ($('symbols').checked) charset += syms;
            if (!charset) charset = lower;
            if ($('exclude').checked) {
                charset = charset.split('').filter(c => !ambiguous.includes(c)).join('');
            }
            return charset;
        }

        function genPassword(len) {
            const charset = getCharset();
            const arr = new Uint32Array(len);
            crypto.getRandomValues(arr);
            return Array.from(arr, v => charset[v % charset.length]).join('');
        }

        function calcStrength(pw) {
            let pool = 0;
            if (/[a-z]/.test(pw)) pool += 26;
            if (/[A-Z]/.test(pw)) pool += 26;
            if (/[0-9]/.test(pw)) pool += 10;
            if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;
            const entropy = Math.log2(pool) * pw.length;
            if (entropy < 40) return { label: 'Weak', pct: 20, color: 'var(--error)' };
            if (entropy < 60) return { label: 'Fair', pct: 40, color: 'var(--warning)' };
            if (entropy < 80) return { label: 'Strong', pct: 70, color: 'var(--accent)' };
            return { label: 'Very Strong', pct: 100, color: 'var(--success)' };
        }

        function generate() {
            const len = +lengthSlider.value;
            const pw = genPassword(len);
            $('password').textContent = pw;
            const s = calcStrength(pw);
            $('strengthFill').style.width = s.pct + '%';
            $('strengthFill').style.background = s.color;
            $('strengthLabel').textContent = s.label + ` (${Math.round(Math.log2(getCharset().length) * len)} bits of entropy)`;
            $('multiList').style.display = 'none';
        }

        function generateMulti() {
            const len = +lengthSlider.value;
            const list = $('multiList');
            list.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const pw = genPassword(len);
                const item = document.createElement('div');
                item.className = 'multi-item';
                item.innerHTML = `<span>${escHtml(pw)}</span><span class="copy-single" onclick="copyText('${escAttr(pw)}')">📋</span>`;
                list.appendChild(item);
            }
            list.style.display = 'block';
        }

        function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function escAttr(s) { return s.replace(/'/g, "\\'").replace(/\\/g, '\\\\'); }

        function copyPw() { copyText($('password').textContent); }
        function copyText(t) {
            navigator.clipboard.writeText(t).then(() => toast('Copied!'));
        }
        function toast(msg) {
            const t = $('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }

        generate();
    </script>
</body>
</html>
